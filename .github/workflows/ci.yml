name: conformance

# DL-0010: gate on kicad/kicad:10.0.5 (exact patch, pinned by tag here -- the digest
# below is recorded for reproducibility and can replace the tag if stronger pinning is
# wanted): kicad/kicad:10.0.5 == sha256:182c8005cb775a2c448a4c18681d489f1ff472a761885eba3e08b07e3c0564de
# A separate, non-gating kicad/kicad:nightly (10.99) job tracks the moving KiCad-11
# target and reports drift without failing the build.

on:
  push:
    paths:
      - "suites/**"
      - "runner/**"
      - "adapters/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "suites/**"
      - "runner/**"
      - "adapters/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

env:
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  gating:
    name: kicad 10.0.5 (gating)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      # The kicad/kicad image's default user is uid 1000 (kicad); GitHub Actions
      # container jobs must run as root so actions/checkout can write to /__w
      # (otherwise checkout fails with EACCES). kicad-cli runs fine as root.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Record oracle identity (DL-0010)
        run: |
          kicad-cli version --format about
          kicad-cli version --format plain

      - name: Reduction self-test (DL-0039)
        # stdlib-only, no Docker/kicad-cli involved -- feeds every reduce_*/build_*_summary
        # function hand-built input directly, so it fails fast and cheaply before the
        # heavier kicad-cli-backed steps below if a reduction regresses (this is the guard
        # that caught a prior reduce_erc = reduce_drc aliasing bug).
        run: python3 -m runner --reduction-selftest

      - name: Run the conformance suite
        run: python3 -m runner suites/

      - name: Determinism self-test (DESIGN §4a)
        run: python3 -m runner --determinism-check suites/

  nightly-tracking:
    name: kicad nightly (10.99, non-gating)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly
      options: --user root  # same reason as the gating job: checkout needs root
    continue-on-error: true  # DL-0010: reports drift, never blocks the gating job
    steps:
      - uses: actions/checkout@v4
      - name: Record oracle identity
        run: kicad-cli version --format about || true
      - name: Run the conformance suite against the moving KiCad-11 target
        run: python3 -m runner suites/
