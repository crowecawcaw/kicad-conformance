name: conformance

# Gating image is pinned by tag; digest for reproducibility: sha256:182c8005cb775a2c448a4c18681d489f1ff472a761885eba3e08b07e3c0564de
on:
  push:
    paths: &paths
      - "suites/**"
      - "runner/**"
      - "adapters/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *paths
  workflow_dispatch: {}

env:
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  gating:
    name: kicad 10.0.5 (gating)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root  # image defaults to uid 1000; checkout needs root to write /__w
    steps:
      - uses: actions/checkout@v4
      - name: Record oracle identity
        run: kicad-cli version --format plain
      - name: Run the conformance suite
        run: python3 -m runner suites/
      - name: Determinism self-test
        run: python3 -m runner --determinism-check suites/
      - name: Asserted-coverage check
        run: python3 -m runner --verify-assertions suites/

  nightly-tracking:
    name: kicad nightly (10.99, non-gating)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly
      options: --user root  # same as gating job
    continue-on-error: true  # reports drift, never blocks the gating job
    steps:
      - uses: actions/checkout@v4
      - name: Record oracle identity
        run: kicad-cli version --format about || true
      - name: Run the conformance suite against the moving KiCad-11 target
        run: python3 -m runner suites/
