concept = "The board's own net-to-pad connectivity (IPC-D-356) is a second, independent connectivity projection: every pad lands on the net the board actually routed it to."
doc     = "cli:pcb-export-ipcd356"

# Same seed-and-upgrade board as 0002/0004 (DL-0011). R1/C1 pads and the F.Cu track +
# through via all sit on "Net-1"; R1's other pad and C1's other pad sit on "GND".
input = "board.kicad_pcb"

[[check]]
op      = "export-ipcd356"
expect  = "ok"
compare = "structured"           # reduce_ipcd356: {net: sorted[(refdes,pad)]} + testpoints
golden  = "board-net.reduced.json"
