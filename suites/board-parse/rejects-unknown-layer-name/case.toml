concept = "A layer-table entry at a fixed (non-copper, non-user) ordinal carrying a name outside KiCad's canonical set is rejected."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
control = "control.kicad_pcb"           # same board with ordinal 25 named "Edge.Cuts" again -> must exit 0
error_contains = "is not in fixed layer hash"

# Rejection only fires for a fixed non-copper slot with an unrecognized name; a
# renamed copper layer is silently re-canonicalized instead of erroring.
