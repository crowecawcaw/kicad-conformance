concept = "A layer-table entry at a fixed (non-copper, non-user) ordinal carrying a name outside KiCad's canonical set is rejected."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
control = "control.kicad_pcb"           # same board with ordinal 25 named "Edge.Cuts" again -> must exit 0
error_contains = "is not in fixed layer hash"

# NOTE: renaming a COPPER layer's table entry (e.g. ordinal 0 "F.Cu" -> "F.Cu2") is silently
# ignored by 10.0.5 -- it re-canonicalizes to "F.Cu" on save instead of erroring. The
# rejection only fires for a fixed *non-copper* slot given a name that is neither the
# canonical name for that ordinal nor a valid "User.N" layer. See report for detail.

# Formerly blocked on a KNOWN ORACLE DIVERGENCE: the runner's old `parse-pcb` probe was
# `pcb upgrade --force`, which SIGSEGVs on every malformed board immediately after
# printing this correct message. DL-0029 remapped `parse-pcb` to `pcb export stats`,
# which rejects the same bytes gracefully (verified: exit 3, "Failed to load board:
# Layer 'Bogus.Name.Here' in file '...' at line 25 is not in fixed layer hash." on
# stderr) -- this case now genuinely PASSes. See docs/DECISIONS.md DL-0029 and
# docs/DIVERGENCES.md's DIV-0001 (kept open, but only via the now-non-default
# `pcb upgrade --force` path).
