concept = "Blind and buried vias on a four-layer board are counted separately in counts.vias and each produce their own layer-span drill file (front-in1 / in1-in2), distinct from a through via's board.drl."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"

# `pcb export ipcd356` emits IPC-D-356 record type "307" for a blind/buried via
# (through vias are "317", SMD pads "327", netless features "367") -- visible directly
# in this case's recorded ipcd356.d356.
