concept = "A pad's pre-10 numeric-only net reference (missing the net name) is rejected; only the two-argument (net NUMBER \"NAME\") form is accepted."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
control = "control.kicad_pcb"           # same pad with (net 1 "SomeNet") -> must exit 0
error_contains = "Expecting net name"

