concept = "The drill report's millimetre column is formatted from a double, so a diameter sitting exactly on a three-decimal tie rounds by the binary value rather than half-away-from-zero: 0.2125 mm prints 0.212 while 0.3175 mm prints 0.318."
doc     = "sexpr-pcb#vias"
input   = "board.kicad_pcb"

# The two drills are chosen so the tie breaks in *opposite* directions, which is
# what makes the case falsifying rather than merely illustrative. An
# implementation that formats an exact decimal and rounds half away from zero --
# the obvious choice -- emits 0.213 and 0.318, so it fails the first via and
# passes the second; a case carrying only one tie would let it through.
# Half-to-even on the decimal digits happens to get both right here, but is still
# the wrong model: neither value is exactly representable in binary, and 0.2125's
# double sits just below the tie while 0.3175's sits just above. Only formatting
# the double reproduces both.
#
# Diameters landing exactly on a tie are rare in real boards, so a sampled corpus
# can easily contain none of them -- which is what a minimal case is for.
