concept = "A same-net pad lying inside a filled area does not anchor it if the pad is set not to connect to zones. With (zone_connect 0) on the pad, the fill is cleared away from it and the area around it is deleted as an island, even though the pad is of the zone's net and geometrically inside the area."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# One GND pour, 0..30 x 0..10 on B.Cu, split into a left and a right filled area
# by a foreign VCC track at x=15 (1 mm wide, 0.2 mm clearance either side -> a
# ~1.41 mm gap, far wider than the 0.25 mm min_thickness, so the fill genuinely
# separates).
#
# BOTH areas contain a GND thru-hole pad. The difference is one token: the right
# pad, at (25,5), carries (zone_connect 0) -- "no connection to zones" -- so the
# zone clears around it instead of connecting to it.
#
# Measured against kicad-cli 10.0.5 (2026-08-08, this exact file, refilled on a
# scratch copy with no project file): **one** filled_polygon, x 0..14.2995. The
# right area is removed despite holding a pad of the zone's own net.
#
# Failure modes this is expected to catch:
#   - anchoring by geometric containment -- "does a pad of this net lie inside
#     the area?" -- which keeps the right area. This is the natural
#     implementation and it is wrong: the test is whether the area and the pad
#     are electrically joined, and a pad the zone refuses to connect to is not
#     joined to it.
#   - ignoring (zone_connect 0) when computing the fill at all, which both keeps
#     the area and floods the pad.
#
# The same distinction shows up zone-side rather than pad-side: with
# (connect_pads no) on the pour and a single GND pad in the LEFT area, kicad-cli
# 10.0.5 keeps BOTH areas -- no area is anchored any more, so the fallback of
# `island-removal-keeps-all-when-none-anchored` takes over and nothing is
# deleted. Geometric containment predicts one area there and two here; it is
# wrong on both.
#
# expected/ is not yet generated -- it needs the Dockerised conformance runner
# (see repo README); the numbers above are the local kicad-cli measurement the
# runner should reproduce.
