concept = "Recomputing a zone's fill applies custom thermal gap and spoke-width rules to the four diagonal relief spokes around a same-net through-hole pad."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# The board ships NO (filled_polygon ...) at all, so every recorded answer except
# `refill` is blind to the fill: the zone-fills.txt answer is the only thing here that
# sees a fill, and the only thing a perturbation of the fill parameters can move.
#
# `connect_pads` with no mode is the default (thermal relief); the pad is the zone's only
# connection, so the spokes are the whole of the fill's interior detail. The sidecar's
# 2 mm gap and 1 mm spoke replace the zone's 0.5 mm values.
