concept = "The 'keep everything when nothing is anchored' fallback is scoped to the ZONE, not to the net. A pour whose areas reach no pad keeps all of them even though a second, disconnected pour of the same net does hold the net's only pad. Having an anchor somewhere on the net is not enough to start deleting the other pour's copper."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# Two GND pours on B.Cu, deliberately far apart:
#   uuid cccc... : 0..30 x 0..10, split into a left and a right filled area by a
#                  foreign VCC track at x=15 (1 mm wide, 0.2 mm clearance either
#                  side -> a ~1.41 mm gap, far wider than the 0.25 mm
#                  min_thickness, so the fill genuinely separates). No pad.
#   uuid dddd... : 0..8 x 14..20, 4 mm clear of cccc, holding the board's only
#                  GND pad (a thru-hole at (4,17)).
# Nothing connects the two pours: no track, no via, no overlap.
#
# Measured against kicad-cli 10.0.5 (2026-08-08, this exact file, refilled on a
# scratch copy with no project file):
#   - cccc has **two** filled_polygons, x 0..14.2995 and x 15.7005..30. Neither
#     is removed.
#   - dddd has one filled_polygon, x 0..8.
#
# Failure modes this is expected to catch:
#   - anchoring evaluated per NET across the whole board ("the net has a pad, so
#     every area that cannot reach it is an island"). That empties cccc
#     completely, which is the most damaging way to get this wrong: it deletes a
#     whole pour on any board that has one connected pour and one stranded one.
#   - treating the fallback as a global switch ("some area somewhere is
#     anchored, so removal is on"), same outcome.
#
# Read with `island-removal-anchor-reaches-through-another-pour`, which is this
# board with the second pour slid over so it overlaps cccc's right area: there,
# cccc's left area IS removed. The pair brackets the rule exactly -- the net's
# copper graph decides which areas are anchored, and the zone decides whether
# removal happens at all.
#
# expected/ is not yet generated -- it needs the Dockerised conformance runner
# (see repo README); the numbers above are the local kicad-cli measurement the
# runner should reproduce.
