concept = "A pour with three voids can carry a vertex that lies in the INTERIOR of one of its own edges. Three voids on one pour, all rectangles, all axis-parallel: KiCad returns 38 vertices where 37 describe the identical region, the 38th sitting on the straight run down one void's right-hand side at a coordinate that is not a corner of anything on the board. The extra vertex encloses no copper -- the area is the same to the square micrometre -- so it is invisible to every comparison except one that matches vertices or edges. It is the min_thickness finish that puts it there, and the operand is now known: sort the voids by x, take three x-consecutive ones, and the finish reads their three BOTTOM edges and nothing else about them."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# THE CASE NAME IS A MISNOMER AND IS KEPT ONLY BECAUSE IT IS THE RECORDED SLUG.
# The bridging is not part of this behaviour; see "WHAT IS NOT INVOLVED" below.
# The board is unchanged, and so is every number it pins.
#
# One 66x46 mm outline and one 60x40 mm F.Cu GND pour at (min_thickness 0.25),
# (connect_pads yes (clearance 0.2)), the net's anchor pad in a far corner, and three
# `gr_text` on the pour's own layer -- each the single glyph "I", so each clears one
# plain rectangle. Nothing on this board is oblique and nothing is curved except the
# four corner chamfers the min_thickness finish puts on the pour itself. The board
# ships NO (filled_polygon ...), so `refill` is the only recorded answer that sees a
# fill.
#
# The three voids, measured (kicad-cli 10.0.5, `pcb drc --refill-zones --save-board`):
#
#   text at    void x                      void y
#   ---------  --------------------------  --------------------------
#   (13, 20)   12.597625 .. 13.402375      18.469125 .. 21.373875    <- L
#   (20, 20)   19.663250 .. 20.336750      18.534750 .. 21.308250    <- M
#   (27, 20)   26.584500 .. 27.415500      18.456000 .. 21.387000    <- R
#
# KiCad returns ONE filled area of 38 vertices. The three voids are joined to the pour
# outline by zero-width bridges. The run down L's right-hand side leaves at
# y = 21.308250 to reach M, comes back, and then continues down to L's own
# bottom-right corner at (13.402375, 18.469125).
#
# IT DOES NOT CONTINUE STRAIGHT. It stops at
#
#     (13.402375, 18.493651)
#
# and starts again. That point is on the segment -- same x, and 18.493651 is between
# 21.308250 and 18.469125 -- so the two edges it replaces describe exactly the run they
# came from. Its y is not a corner of any void, not an edge of the pour, and not the y
# of any bridge. It is 0.024526 mm above L's bottom-right corner.
#
# THE NATURAL WRONG GUESS: that a filled area is determined by the region it covers, so
# a vertex that lies on a straight edge is free to add or drop. It is not free here.
# Emitting that run as one edge gives 37 vertices, the identical region, and an area
# equal to KiCad's to the square micrometre -- and it disagrees with the oracle on two
# directed edges out of 38. Any comparison at vertex or edge granularity has to
# reproduce this, and no comparison at area or coverage granularity can even see it.
# An implementation that normalises its output by dropping collinear vertices, which is
# an ordinary and otherwise harmless thing to do, can never match this board.
#
# THE OPERAND RULE, measured 2026-09-01 and then used to PREDICT a board before running
# it. Write h, b, t for the BOTTOM edges of three x-consecutive voids L, M, R, and
# r = min_thickness/2 - 0.001 for the finishing radius. Then a vertex appears on
#
#     L's RIGHT edge, at   y = b - s(rho) * r,   rho = (h - t) / (b - t)
#
# and on nothing else. On this board L, M, R are the (13,20), (20,20) and (27,20)
# voids, rho = 13125/78750 = 1/6, r = 0.124 and s(1/6) = 0.33144689, which is
# 18.534750 - 0.041099 = 18.493651.
#
# The prediction that confirms it: a five-void board, voids at x = 13, 20, 27, 34, 41
# with bottom edges 18.469125, 18.534750, 18.456000, 18.521625 and 18.442875 (tops
# 21.0, 21.1, 21.2, 21.3, 21.4 so that every void bridges straight to the pour's LEFT
# edge and none is bridged to another). Triples (v1,v2,v3) and (v3,v4,v5) both have
# rho = 1/6; triple (v2,v3,v4) has rho = -0.2 and should give nothing. Predicted
# (13.355500, 18.493651) and (27.355500, 18.480526), one vertex on each of v1's and
# v3's right edges, and KiCad returns exactly those two and no others.
#
# WHAT IS NOT INVOLVED -- each of these was believed and is measured false:
#
#   * THE BRIDGING IS NOT INVOLVED. Push L's top edge from 21.373875 down to 21.000000
#     so that M's cut flies OVER L at y = 21.308250 and lands on the pour's left edge
#     instead of on L, and the vertex is still at 18.493651, to the nanometre. On the
#     five-void board above no void is bridged to another at all and there are two of
#     them. A cut landing on the edge is a coincidence of this board's geometry.
#
#   * b AND t ARE NOT THE NEAREST HORIZONTAL EDGES ABOVE AND BELOW h. Adding a fourth
#     void whose bottom edge sits strictly between t and h (18.458, 18.462, 18.466,
#     18.468), or strictly between h and b (18.500, 18.510, 18.520, 18.530), or below t
#     (18.400, 17.000), leaves the vertex at 18.493651 in all ten. Only the two
#     x-neighbours of L are read.
#
#   * IT IS NOT THE ORDER THE VOIDS APPEAR IN THE FILE. With two extra voids carrying
#     different bottom edges, swapping their order in the file changes nothing;
#     swapping their x positions swaps which of them supplies t. Tested at
#     x = (24,27), (27,24), (34,50), (50,34), (27,40) and (40,27).
#
#   * IT IS NOT AN ARC FACET, and max_error is now decomposed rather than merely
#     dismissed: (max_error 0.001) through (max_error 0.1) moves EVERY void edge on the
#     board by 0.005 - max_error, because a text void is grown by clearance + max_error,
#     and the vertex follows that translation exactly -- 18.497651 at 0.001, 18.488651
#     at 0.01, 18.398651 at 0.1. Relative to the voids it does not move at all, through
#     a hundredfold change in the segment count of every arc on the board.
#
# WHAT THE BOARD PINS ABOUT WHEN IT HAPPENS, all measured on this exact geometry by
# changing one thing at a time:
#
#   * IT NEEDS THE THIRD VOID -- specifically its 18.456000 EDGE, and nothing else about
#     it. Move the (27,20) text to the other copper layer and KiCad returns 30 vertices
#     with L's right-hand side whole. Raising that glyph so the void's OTHER edge moves
#     from 21.387000 to 23.287000, or 25.000000, or lowering it to 21.000000, with
#     18.456000 held, leaves the split at 18.493651 to the nanometre; moving 18.456000
#     instead moves it. Its x does not enter: 24, 30, 40 and 50 all give 18.493651, and
#     so does moving the (20,20) void to 17 or 24.
#
#   * IT IS FRAGILE IN THE HOST. Move the (13,20) text to (13,21) -- the whole void up by
#     exactly 1 mm, the same size, the same pen, the same enclosed area -- and KiCad
#     returns 37 vertices with the edge whole. Under the rule above that is rho leaving
#     its range, not a change of construction.
#
#   * ITS SETBACK IS LINEAR IN r, TO ABOUT FOUR NANOMETRES. Holding this geometry and
#     changing only min_thickness, the setback b - y against r:
#
#         r        setback      r        setback      r        setback
#         39000    12928        69000    22871        104000   34471
#         46500    15414        74000    24528        124000   41099
#         49000    16242        84000    27842        134000   44414
#         59000    19557        94000    31156
#
#     A least-squares line
#     through r = 39000..134000 has slope 0.3314316 and intercept +2.2 nm; individual
#     rows sit within 4 nm of it, in a small staircase rather than at random, so the
#     construction is a straight-line crossing and not an arc.
#
#   * IT IS ON EXACTLY WHEN frac(r / sqrt 2) IS NOT IN [1/2, 3/4), r =
#     min_thickness/2 - 0.001. Zero mismatches over 2203 refills at 1 NANOMETRE steps
#     in r, in three windows (123500..124500, 60000..60600, 45000..45600). That is the
#     exact complement of the switch
#     `min-thickness-opening-splits-a-void-top-edge-one-nanometre-in` measures on a
#     single rectangular void, over 7004 refills of its own, so the two residues are
#     never both present and are the SAME quantity rather than two correlated ones:
#     q = 2*round(r / sqrt 2) - round(r * sqrt 2) is -1, 0 or +1, that case is the
#     q = +1 arm and this one is the rest. On this geometry min_thickness 0.08 through
#     0.27 splits the run except at 0.09, 0.115, 0.135, 0.155, 0.175, 0.18, 0.20,
#     0.22, 0.24 and 0.265, which are exactly that case's on-radii; below 0.08 and
#     above 0.27 the run comes back whole for a different reason. Note this is the
#     switch only -- WHERE the vertex lands is s(rho), and s is still open.
#
#   * THE FRACTION OF r IS SCALE-FREE IN THE TWO y-GAPS. s depends only on
#     rho = (h-t)/(b-t): doubling and tripling both gaps
#     (`perturb/both-y-gaps-doubled/`) leaves the split at exactly 18.493651, and so
#     does scaling them by 4 and by 8 with r scaled to match. Measured at r = 0.499 and
#     b - t = 0.315, over rational rho:
#
#         rho     s            rho     s            rho     s
#         1/60    0.40584569   1/8     0.35195190   1/3     0.25193587
#         1/30    0.39755311   1/7     0.34314429   2/5     0.22163126
#         1/20    0.38924649   1/6     0.33144689   1/2     0.17814629
#         1/15    0.38091182   1/5     0.31519238   3/5     0.13723246
#         1/12    0.37262725   1/4     0.29111022   2/3     0.11144088
#         1/10    0.36433066                        3/4     0.08088176
#                                                   4/5     0.06343287
#                                                   9/10    0.03047896
#
# NOT PINNED HERE, and stated so rather than guessed: the closed form of s(rho), and
# why only some radii are on. s -> 0 as rho -> 1. (1-rho)/s runs from 2.4229 at
# rho = 1/60 to 3.2810 at rho = 9/10 and extrapolates to 2.41414 at rho = 0 and about
# 3.409 at rho = 1, which are 0.00007 and 0.005 away from 1+sqrt(2) and 2+sqrt(2); at
# r = 0.499 the first of those is a 38 nm discrepancy, far outside the nanometre the
# rows are measured to, so it is recorded as a lead and not as the rule. The power law
# s = 0.4146 * (1-rho)^1.228, which reproduces the small-rho rows to within 0.05 %, is
# 8 % out at rho = 9/10 and is dead.
