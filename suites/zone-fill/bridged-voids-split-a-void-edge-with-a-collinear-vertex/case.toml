concept = "A filled area whose voids are bridged out to the pour boundary can carry a vertex that lies in the INTERIOR of one of its own edges. Three voids on one pour, all rectangles, all axis-parallel: KiCad returns 38 vertices where 37 describe the identical region, the 38th sitting on the straight run down one void's right-hand side at a coordinate that is not a corner of anything on the board. The extra vertex encloses no copper -- the area is the same to the square micrometre -- so it is invisible to every comparison except one that matches vertices or edges. It is the min_thickness finish that puts it there, not the bridging: the coordinate is a neighbouring void's own edge set back by a fixed fraction of the finishing radius, and the fraction is fixed by the ratio of two y-gaps between the three voids."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# One 66x46 mm outline and one 60x40 mm F.Cu GND pour at (min_thickness 0.25),
# (connect_pads yes (clearance 0.2)), the net's anchor pad in a far corner, and three
# `gr_text` on the pour's own layer -- each the single glyph "I", so each clears one
# plain rectangle. Nothing on this board is oblique and nothing is curved except the
# four corner chamfers the min_thickness finish puts on the pour itself. The board
# ships NO (filled_polygon ...), so `refill` is the only recorded answer that sees a
# fill.
#
# The three voids, measured (kicad-cli 10.0.5, `pcb drc --refill-zones --save-board`):
#
#   text at    void x                      void y
#   ---------  --------------------------  --------------------------
#   (13, 20)   12.597625 .. 13.402375      18.469125 .. 21.373875    <- the HOST
#   (20, 20)   19.663250 .. 20.336750      18.534750 .. 21.308250    <- bridged from it
#   (27, 20)   26.584500 .. 27.415500      18.456000 .. 21.387000    <- the third
#
# KiCad returns ONE filled area of 38 vertices. The three voids are joined to the pour
# outline by zero-width bridges, and each bridge leaves at the y of the void it is
# going to: the run down the host's right-hand side leaves at y = 21.308250, which is
# the second void's top edge, crosses to it, comes back, and then continues down to the
# host's own bottom-right corner at (13.402375, 18.469125).
#
# IT DOES NOT CONTINUE STRAIGHT. It stops at
#
#     (13.402375, 18.493651)
#
# and starts again. That point is on the segment -- same x, and 18.493651 is between
# 21.308250 and 18.469125 -- so the two edges it replaces describe exactly the run they
# came from. Its y is not a corner of any void, not an edge of the pour, and not the y
# of any bridge. It is 0.024526 mm above the host's bottom-right corner.
#
# THE NATURAL WRONG GUESS: that a filled area is determined by the region it covers, so
# a vertex that lies on a straight edge is free to add or drop. It is not free here.
# Emitting that run as one edge gives 37 vertices, the identical region, and an area
# equal to KiCad's to the square micrometre -- and it disagrees with the oracle on two
# directed edges out of 38. Any comparison at vertex or edge granularity has to
# reproduce this, and no comparison at area or coverage granularity can even see it.
# An implementation that normalises its output by dropping collinear vertices, which is
# an ordinary and otherwise harmless thing to do, can never match this board.
#
# WHAT THE BOARD PINS ABOUT WHEN IT HAPPENS, all measured on this exact geometry by
# changing one thing at a time:
#
#   * IT NEEDS THE THIRD VOID -- specifically its 18.456000 EDGE, and nothing else
#     about it. Move the (27,20) text to the other copper layer and KiCad returns 30
#     vertices with the host's right-hand side whole, straight from 21.308250 to
#     18.469125. The third void is not bridged from the host and does not touch it --
#     it is 13.18 mm away -- but without it the split does not happen. Only that one
#     edge participates: raising the glyph's height so the void's OTHER edge moves from
#     21.387000 to 23.287000, with 18.456000 held, leaves the split at 18.493651 to the
#     nanometre; holding 21.387000 and moving 18.456000 instead destroys it.
#
#   * IT DOES NOT DEPEND ON WHERE THE BRIDGED VOID IS. Move the (20,20) text to
#     (24,20) -- or to (17,20) -- and the split stays at 18.493651, to the nanometre.
#     Neither does the third void's x: 24, 30, 40 and 50 all give 18.493651. The only
#     thing x decides is whether the bridged void's cut lands on the host's run at all;
#     at (40,20) that void's cut reaches the third void instead and the run comes back
#     whole.
#
#   * IT IS FRAGILE IN THE HOST. Move the (13,20) text to (13,21) -- the whole host
#     void up by exactly 1 mm, the same size, the same pen, the same bridge, the same
#     enclosed area -- and KiCad returns 37 vertices with the edge whole. That is the
#     perturbation, and it is the sharpest statement of the case: the answer changes by
#     one vertex under a translation that changes nothing else about the board.
#
# WHERE 18.493651 COMES FROM. It is not a drawn coordinate and no line between two
# vertices of this fill passes through it, but it is not arbitrary either. It is the
# BRIDGED void's 18.534750 edge, set back by a multiple of the min_thickness finishing
# radius -- and that makes the split an artefact of the FINISH, not of the bridging.
#
#   * IT IS THE min_thickness FINISH. At (min_thickness 0.001), where the opening is a
#     no-op, KiCad returns 25 vertices with the run whole. The bridging is unchanged
#     there: the cut still leaves the host at 21.308250 and still comes back.
#
#   * ITS SETBACK IS LINEAR IN THE OPENING RADIUS r = min_thickness/2 - 0.001. Holding
#     this board's geometry and changing only min_thickness:
#
#         min_thickness   r          split y      18.534750 - split
#         0.10            0.049      18.518508    0.016242
#         0.15            0.074      18.510222    0.024528
#         0.25            0.124      18.493651    0.041099
#
#     The three setbacks are 0.331469, 0.331459 and 0.331444 of r. Extrapolating the
#     line to r = 0 gives 18.534749 -- the bridged void's own edge, to the nanometre.
#
#   * THE FRACTION OF r IS SCALE-FREE IN THE TWO y-GAPS. Write h for the host's
#     18.469125 edge, b for the bridged void's 18.534750 edge and t for the third
#     void's 18.456000 edge. The setback divided by r depends only on the ratio
#     (h - t)/(b - t), which is 1/6 here. Doubling both gaps (h -> 18.403500,
#     t -> 18.377250, b unmoved) and tripling them (h -> 18.337875, t -> 18.298500)
#     each leave the split at exactly 18.493651, which is the sharpest single statement
#     of this and is `perturb/both-y-gaps-doubled/`. Measured at r = 0.124, moving h
#     and moving t independently:
#
#         (h-t)/(b-t)   setback/r        (h-t)/(b-t)   setback/r
#         0.039683      0.394476         0.216418      0.307250
#         0.103175      0.362782         0.230159      0.300605
#         0.110169      0.359315         0.260563      0.286056
#         0.166667      0.331444         0.293651      0.270435
#                                        0.300000      0.267460
#
#     The two sweeps interleave and agree: the 0.293651 row comes from moving h and the
#     rows either side of it from moving t, and interpolating the t sweep to 0.293651
#     gives 0.270454 against the measured 0.270435.
#
#   * IT IS NOT AN ARC FACET. (max_error 0.001) through (max_error 0.02) -- a fourfold
#     change in the segment count of every arc on the board, including the pour's own
#     corner chamfers -- all give 18.493651 unchanged.
#
# NOT PINNED HERE, and stated so rather than guessed: the closed form of setback/r as a
# function of that ratio, and why the split appears for some radii and not others. On
# this geometry r = 0.049, 0.074 and 0.124 split the run, while r = 0.024, 0.099,
# 0.149, 0.174, 0.199 and 0.224 return it whole -- at some of those the finish instead
# doubles a vertex on the host void's 21.373875 edge. A power law
# setback/r = 0.4146 * ((b - h)/(b - t))^1.228 reproduces every row of the table above
# to within 0.05 %, which is far outside the nanometre the rows are measured to, so it
# is recorded as a fit and not as the rule.
