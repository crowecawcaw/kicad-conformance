concept = "A thermal-relief spoke is kept only when the copper it runs into extends at least min_thickness beyond the relief ring; a spoke whose copper is cut off closer than that by the board edge is deleted whole, with no stub left inside the relief, while the pad's other spokes are untouched."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# Geometry: a 24 mm square GND pour at (3,3)-(27,27) with one thru-hole GND
# pad (1.6 mm, 0.8 mm drill) at its centre (10,10), relieved with thermal_gap
# 0.5 and thermal_bridge_width 0.5 at min_thickness 0.25, so the relief ring
# is at r = 1.3 mm and the four spokes run at 45, 135, 225 and 315 degrees.
# The Edge.Cuts outline is a 2..28 square whose upper-left corner is cut off
# by a line perpendicular to the 135-degree spoke, placed so that the pour's
# copper boundary (the edge plus the 0.5 mm default copper-to-edge
# clearance) sits exactly 1.545 mm from the pad centre along that spoke --
# 0.245 mm past the relief ring, 5 um short of min_thickness.
#
# Measured against kicad-cli 10.0.5 (2026-09-02) with
# `pcb drc --refill-zones --save-board`: the 135-degree spoke is gone
# entirely -- no bar, no stub inside the relief ring -- and the other three
# spokes are exactly as on an open plane. Move the cut 5 um further out, to
# 1.550 mm, and the spoke comes back whole. Sweeping the cut's distance with
# min_thickness 0.10 and 0.40, with thermal_gap 0.3, and with a 2.4 mm pad
# puts the switch at pad_radius + thermal_gap + min_thickness every time, on
# both sides of a 5 um step, and the switch is all-or-nothing per spoke.
#
# The natural wrong answers: emitting the spoke and letting the edge
# clearance truncate it to a stub (which then anchors the zone and changes
# what island removal deletes), or dropping all four spokes of a pad whose
# one spoke is blocked.
