concept = "A filled area of a zone that is separated from the rest of the pour survives only if a PAD of the zone's net lies in it. Same-net copper that is not a pad does not anchor an area: a track running through it and a via sitting in it are both ignored, and the area is deleted anyway. Recomputing the fill therefore drops the unanchored area entirely rather than keeping isolated copper."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# One GND pour, 0..30 x 0..10 on B.Cu, cut clean in two by a foreign VCC track at
# x=15: the track is 1 mm wide with 0.2 mm clearance either side, so the gap in
# the GND copper is ~1.41 mm, far wider than the 0.25 mm min_thickness, and the
# fill genuinely separates into a left and a right area rather than staying one
# necked region. That separation is the precondition for the behaviour, so an
# engine that fails to split the pour will not exercise the case at all.
#
# The LEFT area holds a GND thru-hole pad. The RIGHT area deliberately holds the
# two decoys: a GND track (22,5)-(28,5) and a GND via at (20,8). Both are the
# zone's own net and both are inside the area; neither anchors it.
#
# Measured against kicad-cli 10.0.5 (2026-08-08, target/island_probe.sh and this
# exact file): the refilled zone has **one** filled_polygon, spanning
# x 0..14.2995 -- the left, pad-anchored area. The right area is gone.
#
# Six sibling probes pinned the rule: with a GND pad in the right area (thru-hole
# or SMD) it survives; with only a track, only a via, or nothing, it is removed;
# with (island_removal_mode 1) it survives regardless.
#
# Failure modes this is expected to catch:
#   - implementing island removal as "connected to any same-net copper", which
#     keeps the right area because of the track or the via. This is the natural
#     reading and it is wrong.
#   - not implementing island removal at all, which keeps both areas.
#   - deleting the whole pour, or deleting the pad-anchored area instead.
#
# Not covered here, and unresolved upstream: what KiCad does when NO area of a
# pour is pad-anchored. Measured in isolation it then removes nothing, which
# cannot explain real boards where a whole zone is emptied -- so the anchoring
# set is evidently wider than a single pour. This case deliberately fixes one
# area as anchored so it tests only the per-area rule.
#
# expected/ is not yet generated -- it needs the Dockerised conformance runner
# (see repo README); the numbers above are the local kicad-cli measurement the
# runner should reproduce.
