concept = "An isolated filled area is anchored by a PAD it is electrically connected to, wherever that pad sits -- the pad does not have to lie inside the area, or even inside the pour. A same-net track leaving the area and ending on a GND pad outside the pour keeps the area alive; delete only that pad and the same area is removed."
doc     = "sexpr-pcb"
input   = "board.kicad_pcb"
extra   = ["refill"]

# Same construction as `island-removal-anchored-only-by-pads`: one GND pour
# 0..30 x 0..10 on B.Cu, split into a left and a right filled area by a foreign
# VCC track at x=15 (1 mm wide, 0.2 mm clearance either side -> a ~1.41 mm gap,
# far wider than the 0.25 mm min_thickness, so the fill genuinely separates).
#
# The LEFT area holds a GND thru-hole pad. The RIGHT area holds no pad at all.
# What it has is a GND track from (25,5) -- inside the area -- to (25,15), which
# is outside the pour, where a GND thru-hole pad sits.
#
# Measured against kicad-cli 10.0.5 (2026-08-08, this exact file, refilled on a
# scratch copy with no project file): **two** filled_polygons,
# x 0..14.2995 and x 15.7005..30. The right area survives.
#
# The control that makes it a measurement rather than an observation: delete the
# (25,15) footprint and nothing else, so the same track now dangles. The right
# area is then removed and the zone has one filled_polygon, x 0..14.2995
# (measured the same day, same way). The track is not what saved the area; the
# pad it reaches is.
#
# Failure modes this is expected to catch:
#   - "an area survives iff a pad of the net lies inside it" -- the obvious
#     generalisation of the sibling case, and wrong. It deletes the right area.
#   - "an area survives iff it touches any same-net copper" -- the opposite
#     error; it happens to give the right answer here, and the wrong one on the
#     sibling case, which is why the two must be read together.
#   - not implementing island removal at all, which passes this case and fails
#     the sibling.
#
# expected/ is not yet generated -- it needs the Dockerised conformance runner
# (see repo README); the numbers above are the local kicad-cli measurement the
# runner should reproduce.
