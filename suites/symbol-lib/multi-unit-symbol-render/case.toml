# Hand-authored fixture (DL-0011), canonicalized with `kicad-cli sym upgrade --force`:
# "T2U" has a common "T2U_0_1" sub-symbol (the rectangle body, unit 0 = shared across all
# units per the docs) plus "T2U_1_1" (pin "1") and "T2U_2_1" (pin "2"). Verified via a
# probe library (kicad-conformance-research/_tmp3/probe.kicad_sym) that `sym export svg`
# writes exactly "T2U_unit1.svg" and "T2U_unit2.svg" -- SY-12. Falsifiable: removing the
# unit-0 rectangle changes BOTH unit SVGs (the shared body vanishes from each); removing
# only "T2U_2_1"'s pin changes only unit2's file.
