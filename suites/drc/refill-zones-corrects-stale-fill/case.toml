concept = "A zone whose shipped fill is stale and disconnected from its own net's pad reports isolated_copper: DRC takes the stored (filled_polygon ...) at face value rather than recomputing it from the zone outline."
doc     = "cli:pcb-drc"
input   = "board.kicad_pcb"
extra   = ["drc"]

# The shipped (filled_polygon ...) is DELIBERATELY stale: a small 2x2mm island at
# (1,1)-(3,3) that does not touch the GND pad at (10,10), while the zone's real outline
# (0,0)-(20,20) does enclose it. DRC reports isolated_copper, which is only possible if
# the stored polygon -- not the outline -- is what the checker reads.
