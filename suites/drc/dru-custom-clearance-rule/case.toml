concept = "A same-stem board.kicad_dru sibling with a custom clearance rule fires against two pads that comply with the board's default netclass clearance but violate the custom minimum, carrying the rule's own name into the finding."
doc     = "cli:pcb-drc"
input   = "board.kicad_pcb"
