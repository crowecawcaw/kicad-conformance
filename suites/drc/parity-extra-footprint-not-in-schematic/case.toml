concept = "A board with two footprints (U1, U2) checked against a same-stem schematic that only places U1 reports U2 as an extra_footprint schematic-parity finding, alongside footprint_symbol_mismatch/net_conflict findings on U1 itself."
doc     = "cli:pcb-drc"
input   = "board.kicad_pcb"
extra   = ["parity"]

# board.kicad_sch is the recognized same-stem parity sibling (TEST_CASE_FORMAT.md §4),
# never declared here. Fixture picked to be unambiguous per DL-0038's caution: no
# mutually-unconnected same-net endpoints (each pad is alone on its own net), so
# unconnected_items has nothing to be ambiguous about.
#
# U1 also carries footprint_symbol_mismatch/net_conflict findings: the schematic symbol
# leaves its Footprint property empty and its pin unassigned to any net (no wires drawn),
# while the board footprint is named "TestPad" and its pad sits on hand-chosen net
# "Net-1" -- a real mismatch, not a fixture bug, and it usefully exercises three distinct
# schematic_parity finding types in one case instead of one.
