concept = "A bus labeled with a vector D[0..1] resolves into separate nets D0 and D1, one per member wire tapped off the bus through a bus entry."
doc     = "sexpr-schematic#buses"
input   = "sheet.kicad_sch"

# Hand-authored fixture (DL-0011): two minimal T2 symbols, each contributing only pin 1
# (a zero-length pin whose electrical point is the placement origin, so no coordinate
# arithmetic is needed -- see the case authoring notes this suite settled on after a
# probe showed a symbol's *second* pin lands at Y-2.54, not Y+2.54, under KiCad's
# unrotated placement transform). Each pin's stub wire carries its own local (label "D0")
# / (label "D1") and taps into a vertical bus through a (bus_entry ...); the bus itself
# carries (label "D[0..1]") purely as the vector's documentation. `sch export netlist`
# resolves the two member wires into distinct nets "/D0" and "/D1" in netlist.net,
# proving the vector notation expands per-member rather than collapsing to one bus net
# (SC-12). A smaller D[0..1] (2 members) was used instead of the inventory's D[0..7]
# example (8 members) -- two members already proves expansion happens; more members
# would not be a different concept, only more of the same fixture ([DL-0025]-style
# minimalism).
