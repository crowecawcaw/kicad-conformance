concept = "A sheet nested inside a sheet inside the root reports the full sheet-name path per component, three levels deep."
doc     = "sexpr-schematic#hierarchy"
input   = "root.kicad_sch"

# Hand-authored fixture (DL-0011): root.kicad_sch instantiates mid.kicad_sch (sheet name
# "mid"), which in turn instantiates leaf.kicad_sch (sheet name "leaf"); leaf.kicad_sch
# places the only component, a minimal T2 (U1). Each file's `path` (used by both
# `(sheet (instances ...))` and the child file's own `(sheet_instances ...)`) accumulates
# the full chain of sheet UUIDs from the root, exactly as hierarchical-sheet's two-level
# case does for one level. Proves SC-31: netlist.net's components.U1.sheet is
# "/mid/leaf/" -- the full human-readable sheet-name path, not just the immediate
# parent's name.
