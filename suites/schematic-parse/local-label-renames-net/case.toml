concept = "A local label renames the net it sits on to /LABEL, and two pins with the same local label merge into one net even with no wire between them."
doc     = "sexpr-schematic#labels"
input   = "sheet.kicad_sch"

# Hand-authored fixture (DL-0011): two minimal custom "T2" symbols (same one used by the
# two-nets-one-shared-pin and hierarchical-sheet fixtures), U1 and U2, placed far apart
# with NO wire between them. Each has a local (label "MYNET") sitting exactly on its pin
# 1 (T2's pin 1 is a zero-length pin, so its electrical point equals the placement
# origin -- no stub wire is needed for the label to land on it). Proves SC-13: a local
# label alone -- not a wire -- is what ties two pins into one net, and the net's name in
# summary.json becomes "/MYNET", not the auto-generated "Net-(U1-Pad1)".
