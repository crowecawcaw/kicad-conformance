concept = "Footprint placement (x, y, rotation, side) is recovered exactly to the printed 1 nm quantum via `pcb export pos`."
doc     = "cli:pcb-export-pos"

# Same seed-and-upgrade board as board-parse/happy/0002-populated-board-stats (DL-0011)
# -- R1 (SMD, top, rotated 90deg) and C1 (through-hole, bottom, rotated 180deg) give
# both a non-zero rotation and both board sides something to assert.
input = "board.kicad_pcb"

[[check]]
op      = "export-pos"
expect  = "ok"
compare = "structured"          # reduce_pos: refdes -> (x,y,rot,side); string-exact = 1 nm
golden  = "pos.reduced.json"
